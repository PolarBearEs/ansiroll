---
# Forces segmentation: target -> controller(delegate_to) -> target, with register
# state carried across the boundaries.
- name: Ansiroll delegate test
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Set a fact on the target
      set_fact:
        tval: "from-target"

    - name: Delegated command on the controller
      command: echo "delegated {{ tval }}"
      delegate_to: localhost
      register: deleg
      changed_when: true

    - name: Use the delegated register back on the target
      debug:
        msg: "got {{ deleg.stdout }}"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Only the newest revision of a PR needs the full test matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, dependency-light job: the runtime interpreter, filters and tests work
  # with only Jinja2 (no Ansible) -- this proves the "runs on a bare target" path.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 packaging pytest
      - run: pip install -e . --no-deps
      - run: pytest tests/test_filters.py tests/test_runtime.py -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and test dependencies
        run: pip install -e ".[test]" "ansible-core==2.21.*" pytest-xdist
      - name: Run branch coverage
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_DEPRECATION_WARNINGS: "False"
        run: >-
          pytest
          -n 2
          --cov=ansiroll
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          -q
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # Full suite across ansible-core versions. Embedding + compilation + the
  # strategy parity tests run against each ansible release.
  matrix:
    # Python 3.9 is not published for Ubuntu 26.04 runners.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", ansible: "ansible-core==2.12.*", experimental: false }
          - { python: "3.10", ansible: "ansible-core==2.14.*", experimental: false }
          - { python: "3.11", ansible: "ansible-core==2.16.*", experimental: false }
          - { python: "3.11", ansible: "ansible-core==2.17.*", experimental: false }
          - { python: "3.12", ansible: "ansible-core==2.18.*", experimental: false }
          - { python: "3.13", ansible: "ansible-core==2.19.*", experimental: false }
          - { python: "3.13", ansible: "ansible-core==2.20.*", experimental: false }
          - { python: "3.13", ansible: "ansible-core==2.21.*", experimental: false }
          # Oldest supported target; harder to install on modern CI, so allow failure.
          - { python: "3.9", ansible: "ansible-base==2.10.17", experimental: true }
    continue-on-error: ${{ matrix.experimental }}
    name: "ansible ${{ matrix.ansible }} (py${{ matrix.python }})"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install ansible + test deps
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.ansible }}" jinja2 packaging pytest pytest-xdist
          pip install -e . --no-deps
      - name: Show versions
        run: |
          python --version
          python -c "import ansible; print('ansible', ansible.__version__)"
      - name: Run tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_DEPRECATION_WARNINGS: "False"
        run: pytest -n 2 -q

  # Compare against each release's own linear strategy using integration
  # targets from the matching ansible/ansible tag. Maintained 2.20 is the full
  # reference suite; adjacent releases use the portable set; EOL releases use
  # stable smoke targets whose entry points predate the portable set.
  upstream-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: "2.10", profile: "smoke", experimental: true }
          - { series: "2.12", profile: "smoke", experimental: false }
          - { series: "2.14", profile: "smoke", experimental: false }
          - { series: "2.16", profile: "smoke", experimental: false }
          - { series: "2.18", profile: "smoke", experimental: false }
          - { series: "2.19", profile: "portable", experimental: false }
          - { series: "2.20", profile: "full", experimental: false }
          - { series: "2.21", profile: "portable", experimental: false }
    continue-on-error: ${{ matrix.experimental }}
    name: "upstream parity ${{ matrix.series }} (${{ matrix.profile }})"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run matching upstream integration targets
        run: >-
          python tests/run_version_matrix.py "${{ matrix.series }}"
          --profile "${{ matrix.profile }}" --skip-repo-tests

  # Run complete upstream targets through their native ansible-test harness.
  # Both the linear reference and injected Ansiroll execution get separate,
  # fresh Docker controllers; the runner compares rc, every recap and task trace.
  ansible-test-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: "2.10", profile: "smoke", experimental: true }
          - { series: "2.12", profile: "smoke", experimental: false }
          - { series: "2.14", profile: "smoke", experimental: false }
          - { series: "2.16", profile: "smoke", experimental: false }
          - { series: "2.18", profile: "smoke", experimental: false }
          - { series: "2.19", profile: "smoke", experimental: false }
          - { series: "2.20", profile: "full", experimental: false }
          - { series: "2.21", profile: "smoke", experimental: false }
    continue-on-error: ${{ matrix.experimental }}
    name: "ansible-test Docker parity ${{ matrix.series }} (${{ matrix.profile }})"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run linear and Ansiroll in fresh ansible-test containers
        run: >-
          python tests/run_ansible_test_suite.py "${{ matrix.series }}"
          --profile "${{ matrix.profile }}"

  # Prove selected semantics are implemented by the shipped agent itself.
  # Unlike hybrid parity, this lane rejects core-linear, controller and
  # delegation fallback and verifies machine-readable provenance is emitted.
  ansible-test-native-parity:
    runs-on: ubuntu-latest
    name: "ansible-test native-only parity 2.20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run native-only parity with execution provenance
        run: >-
          python tests/run_ansible_test_suite.py 2.20
          --profile native --native-only --provenance

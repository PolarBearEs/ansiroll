name: CI

on:
  push:
    branches: [main, master]
  workflow_call:
    inputs:
      ref:
        description: GitHub's merge commit for the reviewed PR
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Fast, dependency-light job: the runtime interpreter, filters and tests work
  # with only Jinja2 (no Ansible) -- this proves the "runs on a bare target" path.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 packaging pytest
      - run: pip install -e . --no-deps
      - run: pytest tests/test_filters.py tests/test_runtime.py -q

  # The coverage run also serves as the full pytest run on Ansible 2.21.
  coverage:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and test dependencies
        run: pip install -e ".[test]" "ansible-core==2.21.*" pytest-xdist
      - name: Run branch coverage
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_DEPRECATION_WARNINGS: "False"
        run: >-
          pytest
          -n 2
          --cov=ansiroll
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          -q
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # Full suite across ansible-core versions. Embedding + compilation + the
  # strategy parity tests run against each ansible release.
  matrix:
    needs: unit
    # Python 3.9 is not published for Ubuntu 26.04 runners.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", ansible: "ansible-core==2.12.*", experimental: false }
          - { python: "3.10", ansible: "ansible-core==2.14.*", experimental: false }
          - { python: "3.11", ansible: "ansible-core==2.16.*", experimental: false }
          - { python: "3.11", ansible: "ansible-core==2.17.*", experimental: false }
          - { python: "3.12", ansible: "ansible-core==2.18.*", experimental: false }
          - { python: "3.13", ansible: "ansible-core==2.19.*", experimental: false }
          - { python: "3.13", ansible: "ansible-core==2.20.*", experimental: false }
          # Oldest supported target; harder to install on modern CI, so allow failure.
          - { python: "3.9", ansible: "ansible-base==2.10.17", experimental: true }
    continue-on-error: ${{ matrix.experimental }}
    name: "ansible ${{ matrix.ansible }} (py${{ matrix.python }})"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install ansible + test deps
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.ansible }}" jinja2 packaging pytest pytest-xdist
          pip install -e . --no-deps
      - name: Show versions
        run: |
          python --version
          python -c "import ansible; print('ansible', ansible.__version__)"
      - name: Run tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_DEPRECATION_WARNINGS: "False"
        run: pytest -n 2 -q

  # Share runner setup for host and Docker parity. Keep the two full 2.20
  # suites parallel because each takes several minutes on its own.
  parity:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: "2.10", host_profile: "smoke", docker_profile: "smoke", experimental: true }
          - { series: "2.12", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.14", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.16", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.18", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.19", host_profile: "portable", docker_profile: "smoke", experimental: false }
          - { series: "2.20", docker_profile: "full", experimental: false }
          - { series: "2.21", host_profile: "portable", docker_profile: "smoke", experimental: false }
    continue-on-error: ${{ matrix.experimental }}
    name: "Ansible parity ${{ matrix.series }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ github.event_name == 'push' }}
      - name: Run linear and Ansiroll in fresh ansible-test containers
        id: docker-parity
        run: >-
          python tests/run_ansible_test_suite.py "${{ matrix.series }}"
          --profile "${{ matrix.docker_profile }}"
          --root "${{ runner.temp }}/docker-parity"
      - name: Run matching upstream integration targets on the host
        if: ${{ !cancelled() && matrix.host_profile && (steps.docker-parity.outcome == 'success' || steps.docker-parity.outcome == 'failure') }}
        run: >-
          python tests/run_version_matrix.py "${{ matrix.series }}"
          --profile "${{ matrix.host_profile }}" --skip-repo-tests

  upstream-parity-full:
    needs: unit
    runs-on: ubuntu-latest
    name: "upstream parity 2.20 (full)"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ github.event_name == 'push' }}
      - name: Run matching upstream integration targets
        run: python tests/run_version_matrix.py 2.20 --profile full --skip-repo-tests

  # Prove selected semantics are implemented by the shipped agent itself.
  # Unlike hybrid parity, this lane rejects core-linear, controller and
  # delegation fallback and verifies machine-readable provenance is emitted.
  ansible-test-native-parity:
    needs: unit
    runs-on: ubuntu-latest
    name: "ansible-test native-only parity 2.20"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ github.event_name == 'push' }}
      - name: Run native-only parity with execution provenance
        run: >-
          python tests/run_ansible_test_suite.py 2.20
          --profile native --native-only --provenance

name: CI

on:
  push:
    branches: [main, master]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request &&
    format('{0}', github.event.comment.user.id) == vars.AMP_CI_ACTOR_ID &&
    startsWith(github.event.comment.body, 'Amp cleared ci.yml for ') &&
    format('amp-ci-pr-{0}', github.event.issue.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  reviewed-head:
    # issue_comment uses the default branch's workflow. Keep write permissions
    # in jobs that only call GitHub's API and never check out PR code.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      vars.AMP_CI_ACTOR_ID != '' &&
      format('{0}', github.event.comment.user.id) == vars.AMP_CI_ACTOR_ID &&
      startsWith(github.event.comment.body, 'Amp cleared ci.yml for ')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      head: ${{ steps.resolve.outputs.head }}
      merge: ${{ steps.resolve.outputs.merge }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          pattern='^Amp cleared ci\.yml for ([a-f0-9]{40})\.$'
          [[ "$COMMENT" =~ $pattern ]] || exit 0
          head=${BASH_REMATCH[1]}
          api="repos/$GITHUB_REPOSITORY"
          for attempt in 1 2 3 4 5; do
            pr=$(gh api "$api/pulls/$PR")
            jq -e --arg head "$head" '.state == "open" and .head.sha == $head' <<< "$pr" >/dev/null || exit 0
            mergeable=$(jq -r '.mergeable' <<< "$pr")
            if [[ "$mergeable" != null ]]; then
              break
            fi
            if [[ "$attempt" != 5 ]]; then
              sleep 2
            fi
          done
          if [[ "$mergeable" != true ]]; then
            echo 'GitHub has no mergeable revision for this PR.' >&2
            exit 1
          fi
          merge=$(jq -er '.merge_commit_sha | strings' <<< "$pr")
          [[ "$merge" =~ ^[a-f0-9]{40}$ ]]
          runs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            combined=$(gh api "$api/commits/$head/status")
            if jq -e --arg merge "$merge" --arg runs "$runs" '.statuses | any(
              .context == "Amp CI" and
              (.target_url // "" | startswith($runs)) and
              (.description // "" | endswith(" merge " + $merge))
            )' <<< "$combined" >/dev/null; then
              echo 'CI was already triggered for this merge commit.'
              exit 0
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head" \
            -f context='Amp CI' -f state=pending -f description="Testing merge $merge" \
            -f target_url="$runs$GITHUB_RUN_ID"
          printf 'head=%s\nmerge=%s\n' "$head" "$merge" >> "$GITHUB_OUTPUT"

  # Fast, dependency-light job: the runtime interpreter, filters and tests work
  # with only Jinja2 (no Ansible) -- this proves the "runs on a bare target" path.
  unit:
    needs: reviewed-head
    if: >-
      !cancelled() && (github.event_name == 'push' ||
      (needs.reviewed-head.result == 'success' && needs.reviewed-head.outputs.merge != ''))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ needs.reviewed-head.outputs.merge || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.reviewed-head.outputs.merge || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 packaging pytest
      - run: pip install -e . --no-deps
      - run: pytest tests/test_filters.py tests/test_runtime.py -q

  # The coverage run also serves as the full pytest run on Ansible 2.21.
  coverage:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and test dependencies
        run: pip install -e ".[test]" "ansible-core==2.21.*" pytest-xdist
      - name: Run branch coverage
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_DEPRECATION_WARNINGS: "False"
        run: >-
          pytest
          -n 2
          --cov=ansiroll
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          -q
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # Full suite across ansible-core versions. Embedding + compilation + the
  # strategy parity tests run against each ansible release.
  matrix:
    needs: unit
    # Python 3.9 is not published for Ubuntu 26.04 runners.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", ansible: "ansible-core==2.12.*", experimental: false }
          - { python: "3.10", ansible: "ansible-core==2.14.*", experimental: false }
          - { python: "3.11", ansible: "ansible-core==2.16.*", experimental: false }
          - { python: "3.11", ansible: "ansible-core==2.17.*", experimental: false }
          - { python: "3.12", ansible: "ansible-core==2.18.*", experimental: false }
          - { python: "3.13", ansible: "ansible-core==2.19.*", experimental: false }
          - { python: "3.13", ansible: "ansible-core==2.20.*", experimental: false }
          # Oldest supported target; harder to install on modern CI, so allow failure.
          - { python: "3.9", ansible: "ansible-base==2.10.17", experimental: true }
    continue-on-error: ${{ matrix.experimental }}
    name: "ansible ${{ matrix.ansible }} (py${{ matrix.python }})"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install ansible + test deps
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.ansible }}" jinja2 packaging pytest pytest-xdist
          pip install -e . --no-deps
      - name: Show versions
        run: |
          python --version
          python -c "import ansible; print('ansible', ansible.__version__)"
      - name: Run tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections
          ANSIBLE_DEPRECATION_WARNINGS: "False"
        run: pytest -n 2 -q

  # Share runner setup for host and Docker parity. Keep the two full 2.20
  # suites parallel because each takes several minutes on its own.
  parity:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: "2.10", host_profile: "smoke", docker_profile: "smoke", experimental: true }
          - { series: "2.12", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.14", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.16", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.18", host_profile: "smoke", docker_profile: "smoke", experimental: false }
          - { series: "2.19", host_profile: "portable", docker_profile: "smoke", experimental: false }
          - { series: "2.20", docker_profile: "full", experimental: false }
          - { series: "2.21", host_profile: "portable", docker_profile: "smoke", experimental: false }
    continue-on-error: ${{ matrix.experimental }}
    name: "Ansible parity ${{ matrix.series }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ github.event_name == 'push' }}
      - name: Run linear and Ansiroll in fresh ansible-test containers
        id: docker-parity
        run: >-
          python tests/run_ansible_test_suite.py "${{ matrix.series }}"
          --profile "${{ matrix.docker_profile }}"
          --root "${{ runner.temp }}/docker-parity"
      - name: Run matching upstream integration targets on the host
        if: ${{ !cancelled() && matrix.host_profile && (steps.docker-parity.outcome == 'success' || steps.docker-parity.outcome == 'failure') }}
        run: >-
          python tests/run_version_matrix.py "${{ matrix.series }}"
          --profile "${{ matrix.host_profile }}" --skip-repo-tests

  upstream-parity-full:
    needs: unit
    runs-on: ubuntu-latest
    name: "upstream parity 2.20 (full)"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ github.event_name == 'push' }}
      - name: Run matching upstream integration targets
        run: python tests/run_version_matrix.py 2.20 --profile full --skip-repo-tests

  # Prove selected semantics are implemented by the shipped agent itself.
  # Unlike hybrid parity, this lane rejects core-linear, controller and
  # delegation fallback and verifies machine-readable provenance is emitted.
  ansible-test-native-parity:
    needs: unit
    runs-on: ubuntu-latest
    name: "ansible-test native-only parity 2.20"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.unit.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: ${{ github.event_name == 'push' }}
      - name: Run native-only parity with execution provenance
        run: >-
          python tests/run_ansible_test_suite.py 2.20
          --profile native --native-only --provenance

  report-pr-ci:
    needs: [reviewed-head, unit, coverage, matrix, parity, upstream-parity-full, ansible-test-native-parity]
    if: always() && needs.reviewed-head.outputs.head != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ needs.reviewed-head.outputs.head }}
          MERGE: ${{ needs.reviewed-head.outputs.merge }}
          PASSED: >-
            ${{ needs.unit.result == 'success' && needs.coverage.result == 'success' &&
            needs.matrix.result == 'success' && needs.parity.result == 'success' &&
            needs.upstream-parity-full.result == 'success' && needs.ansible-test-native-parity.result == 'success' }}
        run: |
          state=failure
          description="Tests did not pass on merge $MERGE"
          if [[ "$PASSED" == true ]]; then
            # The aggregate matrix result can miss a job cancelled before it got a runner.
            # Use all attempts so re-running failed jobs still includes earlier successes.
            jobs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100")
            if jq -e --arg reporter "$GITHUB_JOB" '
              [.[].jobs[]] | group_by(.name) | map(max_by(.id)) |
              map(select(.name != $reporter and .name != "ansible ansible-base==2.10.17 (py3.9)"
                and .name != "Ansible parity 2.10")) |
              length > 0 and all(.[]; .conclusion == "success")
            ' <<< "$jobs" >/dev/null; then
              state=success
              description="Tests passed on merge $MERGE"
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" \
            -f context='Amp CI' -f state="$state" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

name: Reviewed PR CI

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request &&
    format('{0}', github.event.comment.user.id) == vars.AMP_CI_ACTOR_ID &&
    startsWith(github.event.comment.body, 'Amp cleared ci.yml for ') &&
    format('amp-ci-pr-{0}-{1}', github.event.issue.number, github.event.comment.body) || github.run_id }}
  queue: max

jobs:
  reviewed-head:
    # issue_comment uses the default branch's workflow. Keep write permissions
    # in jobs that only call GitHub's API and never check out PR code.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      vars.AMP_CI_ACTOR_ID != '' &&
      format('{0}', github.event.comment.user.id) == vars.AMP_CI_ACTOR_ID &&
      startsWith(github.event.comment.body, 'Amp cleared ci.yml for ')
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
      statuses: write
    outputs:
      head: ${{ steps.resolve.outputs.head }}
      merge: ${{ steps.resolve.outputs.merge }}
      attempt: ${{ steps.resolve.outputs.attempt }}
      check: ${{ steps.resolve.outputs.check }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          pattern='^Amp cleared ci\.yml for ([a-f0-9]{40})\.$'
          [[ "$COMMENT" =~ $pattern ]] || exit 0
          head=${BASH_REMATCH[1]}
          api="repos/$GITHUB_REPOSITORY"
          for attempt in 1 2 3 4 5; do
            pr=$(gh api "$api/pulls/$PR")
            jq -e --arg head "$head" '.state == "open" and .head.sha == $head' <<< "$pr" >/dev/null || exit 0
            mergeable=$(jq -r '.mergeable' <<< "$pr")
            if [[ "$mergeable" != null ]]; then
              break
            fi
            if [[ "$attempt" != 5 ]]; then
              sleep 2
            fi
          done
          if [[ "$mergeable" != true ]]; then
            echo 'GitHub has no mergeable revision for this PR.' >&2
            exit 1
          fi
          merge=$(jq -er '.merge_commit_sha | strings' <<< "$pr")
          [[ "$merge" =~ ^[a-f0-9]{40}$ ]]
          runs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
          check_name="Amp CI / PR #$PR"
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            combined=$(gh api "$api/commits/$merge/status")
            if previous_run=$(jq -er --arg merge "$merge" --arg runs "$runs" '.statuses[] | select(
              .context == "Amp CI" and
              .state == "success" and
              (.target_url // "" | startswith($runs)) and
              (.description // "" | endswith(" merge " + $merge))
            ) | .target_url' <<< "$combined"); then
              gh api --silent --method POST "$api/check-runs" \
                -f name="$check_name" -f head_sha="$head" -f details_url="$previous_run" \
                -f status=completed -f conclusion=success \
                -f 'output[title]=Reviewed PR CI passed' \
                -f "output[summary]=Previously tested merge commit: $merge" \
                || echo '::warning::Could not publish Reviewed PR CI to the PR head.'
              echo 'CI already passed for this merge commit.'
              exit 0
            fi
          fi
          gh api --method POST "$api/statuses/$merge" \
            -f context='Amp CI' -f state=pending -f description="Testing merge $merge" \
            -f target_url="$runs$GITHUB_RUN_ID"
          check=''
          if ! check=$(gh api --method POST "$api/check-runs" --jq '.id' \
            -f name="$check_name" -f head_sha="$head" -f status=in_progress \
            -f details_url="$runs$GITHUB_RUN_ID" -f 'output[title]=Reviewed PR CI running' \
            -f "output[summary]=Testing merge commit: $merge"); then
            echo '::warning::Could not publish Reviewed PR CI to the PR head.'
            check=''
          fi
          printf 'head=%s\nmerge=%s\nattempt=%s\ncheck=%s\n' \
            "$head" "$merge" "$GITHUB_RUN_ATTEMPT" "$check" >> "$GITHUB_OUTPUT"

  tests:
    needs: reviewed-head
    if: needs.reviewed-head.outputs.merge != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.reviewed-head.outputs.merge }}

  report-pr-ci:
    needs: [reviewed-head, tests]
    if: always() && needs.reviewed-head.outputs.merge != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          HEAD: ${{ needs.reviewed-head.outputs.head }}
          MERGE: ${{ needs.reviewed-head.outputs.merge }}
          MERGE_ATTEMPT: ${{ needs.reviewed-head.outputs.attempt }}
          CHECK: ${{ needs.reviewed-head.outputs.check }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          finish_check() {
            [[ -n "$CHECK" ]] || return 0
            gh api --silent --method PATCH "$api/check-runs/$CHECK" \
              -f status=completed -f conclusion="$1" \
              -f "output[title]=$2" -f "output[summary]=Merge commit: $MERGE" \
              || echo '::warning::Could not update Reviewed PR CI on the PR head.'
          }
          combined=$(gh api "$api/commits/$MERGE/status")
          if ! jq -e --arg run "$run_url" --arg merge "$MERGE" '.statuses | any(
            .context == "Amp CI" and .target_url == $run and
            (.description // "" | endswith(" merge " + $merge))
          )' <<< "$combined" >/dev/null; then
            finish_check cancelled 'Another run owns this merge result'
            echo 'Another run owns the status for this merge commit.'
            exit 0
          fi

          # Confirm each required job before publishing success. Re-runs can
          # reuse results from attempts that tested the same merge.
          state=error
          if [[ "$TESTS_RESULT" == failure ]]; then
            state=failure
          elif [[ "$TESTS_RESULT" == success ]] &&
               jobs=$(gh api --paginate --slurp "$api/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100"); then
            if jq -e --arg reporter "$GITHUB_JOB" --argjson attempt "$MERGE_ATTEMPT" '
              [.[].jobs[] | select(.run_attempt >= $attempt)] |
              group_by(.name) | map(max_by([.run_attempt, .id])) |
              map(select(.name != $reporter and .name != "reviewed-head"
                and (.name | endswith("ansible ansible-base==2.10.17 (py3.9)") | not)
                and (.name | endswith("Ansible parity 2.10") | not))) |
              # ci.yml defines four standalone jobs and seven required legs in each matrix.
              length == 18 and all(.[]; .conclusion == "success")
            ' <<< "$jobs" >/dev/null; then
              state=success
            fi
          fi
          case "$state" in
            success) description="Tests passed on merge $MERGE" ;;
            failure) description="CI failed on merge $MERGE" ;;
            error) description="Incomplete job results for merge $MERGE" ;;
          esac
          gh api --method POST "$api/statuses/$MERGE" \
            -f context='Amp CI' -f state="$state" -f description="$description" \
            -f target_url="$run_url"
          # The head check is for visibility. The status above attests to the
          # exact synthetic merge commit, including its base revision.
          if [[ -n "$CHECK" ]]; then
            if ! pr=$(gh api "$api/pulls/$PR"); then
              finish_check cancelled 'Could not verify the current PR revision'
            elif ! jq -e --arg head "$HEAD" --arg merge "$MERGE" '
              .state == "open" and .head.sha == $head and .merge_commit_sha == $merge
            ' <<< "$pr" >/dev/null; then
              finish_check cancelled 'PR revision changed during CI'
            elif [[ "$state" == success ]]; then
              finish_check success 'Reviewed PR CI passed'
            else
              finish_check failure "$description"
            fi
          fi
          [[ "$state" == success ]]

name: Manual Full PR CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Full CI for PR #{0}', inputs.pr_number) || 'Invalidate stale PR CI checks' }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number targeting master
        type: string
        required: true
      head_sha:
        description: Full SHA of the pull request commit to test
        type: string
        required: true
  push:
    branches: [master]
  pull_request_target:
    types: [edited, reopened, synchronize]

permissions: {}

env:
  MERGE_STATUS_CONTEXT: Manual Full CI (merge candidate)
  LEGACY_MERGE_STATUS_OPTIONAL: ${{ vars.MANUAL_CI_LEGACY_STATUS_OPTIONAL }}

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && format('manual-full-ci-pr-{0}', inputs.pr_number) || github.run_id }}
  queue: max

jobs:
  invalid-dispatch-ref:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::Dispatch Manual Full PR CI from master.'
          exit 1

  reviewed-head:
    # Keep write permissions in API-only jobs without a checkout.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      head: ${{ steps.resolve.outputs.head }}
      base: ${{ steps.resolve.outputs.base }}
      merge: ${{ steps.resolve.outputs.merge }}
      attempt: ${{ steps.resolve.outputs.attempt }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
        run: |
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ && "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Supply a PR number and its full head SHA.'
            exit 1
          fi
          head="$EXPECTED_HEAD"
          api="repos/$GITHUB_REPOSITORY"
          verified=false
          for attempt in 1 2 3 4 5; do
            pr=$(gh api "$api/pulls/$PR")
            if ! jq -e --arg head "$head" '
              .state == "open" and .base.ref == "master" and .head.sha == $head
            ' <<< "$pr" >/dev/null; then
              echo '::error::The expected commit is no longer the head of an open PR targeting master.'
              exit 1
            fi
            mergeable=$(jq -r '.mergeable' <<< "$pr")
            if [[ "$mergeable" == false ]]; then
              break
            fi
            merge=$(jq -r '.merge_commit_sha // empty' <<< "$pr")
            base=$(jq -r '.base.sha // empty' <<< "$pr")
            if [[ "$base" != "$GITHUB_SHA" ]]; then
              echo '::error::The base changed. Start a fresh Manual Full PR CI run from master.'
              exit 1
            fi
            if [[ "$mergeable" == true && "$merge" =~ ^[a-f0-9]{40}$ && "$base" =~ ^[a-f0-9]{40}$ ]] &&
               commit=$(gh api "$api/git/commits/$merge") &&
               jq -e --arg base "$base" --arg head "$head" '
                 [.parents[].sha] == [$base, $head]
               ' <<< "$commit" >/dev/null; then
              verified=true
              break
            fi
            if [[ "$attempt" != 5 ]]; then
              sleep 2
            fi
          done
          if [[ "$verified" != true ]]; then
            echo 'GitHub has no verified merge commit for the current PR revision.' >&2
            exit 1
          fi
          runs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
          printf 'head=%s\nbase=%s\nattempt=%s\n' "$head" "$base" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          # Keep the legacy merge status until master protection is migrated.
          for context in "$MERGE_STATUS_CONTEXT" 'Manual Full CI'; do
            gh api --method POST "$api/statuses/$merge" \
              -f context="$context" -f state=pending -f description="Testing merge $merge" \
              -f target_url="$runs$GITHUB_RUN_ID" && continue
            status_error=$?
            if [[ "$context" == "$MERGE_STATUS_CONTEXT" || "$LEGACY_MERGE_STATUS_OPTIONAL" != true ]]; then
              exit "$status_error"
            fi
            echo '::warning::Could not publish the legacy merge status.'
          done
          printf 'merge=%s\n' "$merge" >> "$GITHUB_OUTPUT"

  tests:
    needs: reviewed-head
    if: needs.reviewed-head.outputs.merge != ''
    permissions:
      contents: read
    cache-mode: none
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.reviewed-head.outputs.merge }}
      require_all: true

  report-pr-ci:
    needs: [reviewed-head, tests]
    if: always() && needs.reviewed-head.outputs.merge != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      pull-requests: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ needs.reviewed-head.outputs.head }}
          BASE: ${{ needs.reviewed-head.outputs.base }}
          MERGE: ${{ needs.reviewed-head.outputs.merge }}
          MERGE_ATTEMPT: ${{ needs.reviewed-head.outputs.attempt }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          details_url="$run_url/attempts/$GITHUB_RUN_ATTEMPT"
          report_error=0
          state=error
          conclusion=action_required
          description="Incomplete job results for merge $MERGE"
          required_jobs_passed() {
            local delay jobs
            for delay in 0 2 4 6; do
              ((delay == 0)) || sleep "$delay"
              if jobs=$(gh api --paginate "$api/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100") &&
                 jq -se --argjson attempt "$MERGE_ATTEMPT" '
                  [.[].jobs[] | select(.run_attempt >= $attempt)] |
                  group_by(.name) | map(max_by([.run_attempt, .id])) |
                  map(select(.name | startswith("tests / "))) |
                  # ci.yml has four standalone jobs and eight legs per matrix.
                  length == 20 and all(.[]; .conclusion == "success")
                 ' <<< "$jobs" >/dev/null; then
                return 0
              fi
            done
            echo '::warning::Could not verify that all required jobs passed.' >&2
            return 1
          }
          if combined=$(gh api "$api/commits/$MERGE/status"); then
            if ! jq -e --arg run "$run_url" --arg merge "$MERGE" --arg context "$MERGE_STATUS_CONTEXT" '.statuses | any(
              .context == $context and .target_url == $run and
              (.description // "" | endswith(" merge " + $merge))
            )' <<< "$combined" >/dev/null; then
              echo 'Another run owns the status for this merge commit.'
              exit 0
            fi
            # Confirm each required job before publishing success. Re-runs can
            # reuse results from attempts that tested the same merge.
            if [[ "$TESTS_RESULT" == failure ]]; then
              state=failure
            elif [[ "$TESTS_RESULT" == success ]] && required_jobs_passed; then
              state=success
            elif [[ "$TESTS_RESULT" == cancelled ]]; then
              conclusion=cancelled
            fi
            case "$state" in
              success) description="Tests passed on merge $MERGE" ;;
              failure) description="CI failed on merge $MERGE" ;;
            esac
            # Require both writes until the protection cutover is verified.
            for context in 'Manual Full CI' "$MERGE_STATUS_CONTEXT"; do
              gh api --method POST "$api/statuses/$MERGE" \
                -f context="$context" -f state="$state" -f description="$description" \
                -f target_url="$run_url" && continue
              status_error=$?
              if [[ "$context" == "$MERGE_STATUS_CONTEXT" || "$LEGACY_MERGE_STATUS_OPTIONAL" != true ]]; then
                report_error=$status_error
                break
              fi
              echo '::warning::Could not publish the legacy merge status.'
            done
          else
            report_error=$?
          fi

          title="$description"
          if ((report_error)); then
            conclusion=action_required
            title='Could not publish merge status'
          elif [[ "$state" != error ]]; then
            conclusion="$state"
            [[ "$state" != success ]] || title='Manual full PR CI passed'
          elif [[ "$conclusion" == cancelled ]]; then
            title='Manual full PR CI was cancelled'
          fi

          # Only create terminal checks. A force cancellation can skip the
          # reporter entirely, so it must not strand an in-progress check.
          current_revision() {
            local delay pr mergeable actual_merge
            for delay in 0 2 4; do
              ((delay == 0)) || sleep "$delay"
              pr=$(gh api "$api/pulls/$PR") || continue
              jq -e --arg head "$HEAD" --arg base "$BASE" '
                .state == "open" and .head.sha == $head and .base.ref == "master" and .base.sha == $base
              ' <<< "$pr" >/dev/null || return 1
              mergeable=$(jq -r '.mergeable' <<< "$pr")
              case "$mergeable" in
                null) continue ;;
                true) ;;
                *) return 1 ;;
              esac
              actual_merge=$(jq -r '.merge_commit_sha // empty' <<< "$pr")
              [[ -n "$actual_merge" ]] || continue
              [[ "$actual_merge" == "$MERGE" ]]
              return
            done
            return 2
          }
          if current_revision; then
            for attempt in 1 2 3; do
              # Keep the result visible on the PR head under a distinct name.
              if check=$(gh api --method POST "$api/check-runs" --jq '.id' \
                -f name="Manual Full CI" -f head_sha="$HEAD" -f details_url="$details_url" \
                -f external_id="manual-full-ci:pr:$PR" \
                -f status=completed -f conclusion="$conclusion" -f "output[title]=$title" \
                -f "output[summary]=$(printf 'Merge commit: %s\nBase commit: %s' "$MERGE" "$BASE")"); then
                revision_status=0
                current_revision || revision_status=$?
                if ((revision_status)); then
                  cancelled_title='PR revision changed'
                  if ((revision_status == 2)); then
                    cancelled_title='Could not verify the PR revision'
                    echo '::error::GitHub did not confirm the PR revision after publishing the check.'
                    ((report_error)) || report_error=1
                  fi
                  gh api --silent --method PATCH "$api/check-runs/$check" \
                    -f status=completed -f conclusion=cancelled \
                    -f "output[title]=$cancelled_title" \
                    -f 'output[summary]=Run Manual Full PR CI for the current merge commit.' ||
                    { update_error=$?; ((report_error)) || report_error=$update_error; }
                fi
                break
              elif [[ "$attempt" == 3 ]]; then
                echo '::error::Could not publish Manual Full CI to the PR head.'
                ((report_error)) || report_error=1
              else
                sleep "$attempt"
              fi
            done
          elif [[ "$?" == 2 ]]; then
            echo '::error::GitHub did not confirm the PR revision. The PR-head check was not published.'
            ((report_error)) || report_error=1
          fi
          ((report_error == 0)) || exit "$report_error"
          [[ "$state" == success ]]

  invalidate-head-checks:
    if: github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action == 'reopened' || github.event.action == 'synchronize' ||
          github.event.changes.base.ref.from != ''))
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          retry_api() {
            local attempt output
            for attempt in 1 2 3; do
              if output=$(gh api "$@"); then
                printf '%s\n' "$output"
                return 0
              fi
              [[ "$attempt" == 3 ]] || sleep "$attempt"
            done
            return 1
          }
          filter='. | [.number, .head.sha, .base.sha, .base.ref] | @tsv'
          if [[ -n "$EVENT_PR" ]]; then
            prs=$(retry_api "$api/pulls/$EVENT_PR" --jq "$filter")
          else
            prs=$(retry_api --paginate "$api/pulls?state=open&base=master&per_page=100" --jq ".[] | $filter")
          fi
          failed=0
          while IFS=$'\t' read -r pr head base branch; do
            [[ -n "$pr" ]] || continue
            # Check runs are attached to commits. Include older reports so a
            # newer check for another PR with the same head can't hide ours.
            # Legacy reports have no reliable owner and are left alone.
            if ! checks=$(retry_api --method GET --paginate "$api/commits/$head/check-runs" \
              -f check_name="Manual Full CI" -f filter=all -F per_page=100) ||
               ! stale=$(jq -r --arg owner "manual-full-ci:pr:$pr" --arg base "$base" --arg branch "$branch" '
              .check_runs[] | select(.app.slug == "github-actions" and .external_id == $owner and
                .conclusion != "cancelled" and
                ($branch != "master" or (.output.summary // "" | endswith("Base commit: " + $base) | not))) | .id
            ' <<< "$checks"); then
              echo "::warning::Could not inspect CI checks for PR #$pr."
              failed=1
              continue
            fi
            [[ -n "$stale" ]] || continue
            if ! current=$(retry_api "$api/pulls/$pr" --jq "$filter"); then
              echo "::warning::Could not recheck the revision of PR #$pr."
              failed=1
              continue
            fi
            [[ "$current" == "$pr"$'\t'"$head"$'\t'"$base"$'\t'"$branch" ]] || continue
            while read -r id; do
              if ! retry_api --silent --method PATCH "$api/check-runs/$id" \
                -f status=completed -f conclusion=cancelled \
                -f 'output[title]=PR base changed' -f 'output[summary]=Run Manual Full PR CI for the new merge commit.'; then
                echo "::warning::Could not cancel stale CI check $id for PR #$pr."
                failed=1
              fi
            done <<< "$stale"
          done <<< "$prs"
          exit "$failed"

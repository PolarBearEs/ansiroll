name: Reviewed PR CI

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request &&
    format('{0}', github.event.comment.user.id) == vars.AMP_CI_ACTOR_ID &&
    startsWith(github.event.comment.body, 'Amp cleared ci.yml for ') &&
    format('amp-ci-pr-{0}-{1}', github.event.issue.number, github.event.comment.body) || github.run_id }}
  queue: max

jobs:
  reviewed-head:
    # issue_comment uses the default branch's workflow. Keep write permissions
    # in jobs that only call GitHub's API and never check out PR code.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      vars.AMP_CI_ACTOR_ID != '' &&
      format('{0}', github.event.comment.user.id) == vars.AMP_CI_ACTOR_ID &&
      startsWith(github.event.comment.body, 'Amp cleared ci.yml for ')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    outputs:
      merge: ${{ steps.resolve.outputs.merge }}
      attempt: ${{ steps.resolve.outputs.attempt }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          pattern='^Amp cleared ci\.yml for ([a-f0-9]{40})\.$'
          [[ "$COMMENT" =~ $pattern ]] || exit 0
          head=${BASH_REMATCH[1]}
          api="repos/$GITHUB_REPOSITORY"
          for attempt in 1 2 3 4 5; do
            pr=$(gh api "$api/pulls/$PR")
            jq -e --arg head "$head" '.state == "open" and .head.sha == $head' <<< "$pr" >/dev/null || exit 0
            mergeable=$(jq -r '.mergeable' <<< "$pr")
            if [[ "$mergeable" != null ]]; then
              break
            fi
            if [[ "$attempt" != 5 ]]; then
              sleep 2
            fi
          done
          if [[ "$mergeable" != true ]]; then
            echo 'GitHub has no mergeable revision for this PR.' >&2
            exit 1
          fi
          merge=$(jq -er '.merge_commit_sha | strings' <<< "$pr")
          [[ "$merge" =~ ^[a-f0-9]{40}$ ]]
          runs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            combined=$(gh api "$api/commits/$merge/status")
            if jq -e --arg merge "$merge" --arg runs "$runs" '.statuses | any(
              .context == "Amp CI" and
              (.state == "success" or .state == "failure") and
              (.target_url // "" | startswith($runs)) and
              (.description // "" | endswith(" merge " + $merge))
            )' <<< "$combined" >/dev/null; then
              echo 'CI was already triggered for this merge commit.'
              exit 0
            fi
          fi
          gh api --method POST "$api/statuses/$merge" \
            -f context='Amp CI' -f state=pending -f description="Testing merge $merge" \
            -f target_url="$runs$GITHUB_RUN_ID"
          printf 'merge=%s\nattempt=%s\n' "$merge" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  tests:
    needs: reviewed-head
    if: needs.reviewed-head.outputs.merge != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.reviewed-head.outputs.merge }}

  report-pr-ci:
    needs: [reviewed-head, tests]
    if: always() && needs.reviewed-head.outputs.merge != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          MERGE: ${{ needs.reviewed-head.outputs.merge }}
          MERGE_ATTEMPT: ${{ needs.reviewed-head.outputs.attempt }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          combined=$(gh api "$api/commits/$MERGE/status")
          if ! jq -e --arg run "$run_url" --arg merge "$MERGE" '.statuses | any(
            .context == "Amp CI" and .target_url == $run and
            (.description // "" | endswith(" merge " + $merge))
          )' <<< "$combined" >/dev/null; then
            echo 'Another run owns the status for this merge commit.'
            exit 0
          fi

          # A missing or cancelled job leaves this merge eligible for another
          # clearance. Re-runs can reuse results since the merge was selected.
          state=error
          if jobs=$(gh api --paginate --slurp "$api/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100"); then
            state=$(jq -er --arg reporter "$GITHUB_JOB" --argjson attempt "$MERGE_ATTEMPT" '
              [.[].jobs[] | select(.run_attempt >= $attempt)] |
              group_by(.name) | map(max_by([.run_attempt, .id])) |
              map(select(.name != $reporter and .name != "reviewed-head"
                and (.name | endswith("ansible ansible-base==2.10.17 (py3.9)") | not)
                and (.name | endswith("Ansible parity 2.10") | not))) |
              # ci.yml defines four standalone jobs and seven required legs in each matrix.
              if any(.[]; .conclusion == "failure") then "failure"
              elif length == 18 and all(.[]; .conclusion == "success") then "success"
              else "error" end
            ' <<< "$jobs") || state=error
          fi
          case "$state" in
            success) description="Tests passed on merge $MERGE" ;;
            failure) description="Tests failed on merge $MERGE" ;;
            error) description="Incomplete job results for merge $MERGE" ;;
          esac
          gh api --method POST "$api/statuses/$MERGE" \
            -f context='Amp CI' -f state="$state" -f description="$description" \
            -f target_url="$run_url"
          [[ "$state" == success ]]
